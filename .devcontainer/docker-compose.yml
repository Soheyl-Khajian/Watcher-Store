# .devcontainer/docker-compose.yml

services:
  app:
    build:
      # ← مسیر ساخت ایمیج شخصی‌سازی شده
      context: ../backend # ← مسیر دایرکتوری فعلی
      dockerfile: Dockerfile
    image: custom-devcontainer:latest # ← اسم ایمیج شخصی‌سازی شده
    working_dir: /workspace
    user: node # ← تضمین اجرای همه چیز به عنوان node user
    volumes:
      - ..:/workspace:cached
      - dev_node_modules:/workspace/node_modules
      - payload_next_cache:/workspace/backend/payload-cms/.next
      - frontend_next_cache:/workspace/frontend/.next
    env_file:
      - ../.env
    depends_on:
      #صبر کن دیتابیس کاملا آماه شه، بعد شروع به کار کن
      - db
    command: sleep infinity

  db:
    image: postgres:14-alpine
    restart: unless-stopped # ← ریستارت خودکار در صورت توقف
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d # ← اسکریپت‌های اولیه برای راه‌اندازی دیتابیس
    env_file:
      - ../.env
    # healthcheck:
    #   test:
    #     ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
    #   interval: 10s
    #   retries: 5
    ports:
      - "5433:5432"

volumes:
  postgres-data:
  dev_node_modules: {}
  payload_next_cache: {}
  frontend_next_cache: {}
