# .devcontainer/docker-compose.yml
#
# The Dev Container: one app container (the editor attaches to it) and
# PostgreSQL. The apps' database host is "db"; port 5433 on this computer's
# loopback interface is there for your own tools (psql, a GUI).
#
# Volumes keep the slow parts between rebuilds: node_modules (it must sit on
# the same filesystem as the pnpm store volume, so pnpm can hardlink instead
# of copying), the two Next.js caches and the database. Only the root
# node_modules gets a volume: the per-package ones hold just symlinks into
# it.

services:
  app:
    build:
      # Nothing is copied into the image: the smallest possible context.
      context: .
      dockerfile: Dockerfile
    image: watcher-store-devcontainer:latest
    working_dir: /workspace
    user: node
    volumes:
      - ..:/workspace:cached
      - dev_node_modules:/workspace/node_modules
      - payload_next_cache:/workspace/backend/payload-cms/.next
      - frontend_next_cache:/workspace/frontend/.next
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    # The editor runs the lifecycle commands (devcontainer.json); the
    # container itself only has to stay up.
    command: sleep infinity

  db:
    image: postgres:14-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - ../.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Loopback only: the development password must not be reachable from
    # other machines on the network.
    ports:
      - '127.0.0.1:5433:5432'

volumes:
  postgres-data:
  dev_node_modules:
  payload_next_cache:
  frontend_next_cache:
