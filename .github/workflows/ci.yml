name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Read-only token: this workflow only checks the code.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes older runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Build-time placeholders only. None of these are secrets, and no
    # service is contacted during the build: Payload validates its
    # environment while building, and the storefront embeds the public URLs
    # into its browser bundle.
    env:
      PAYLOAD_SECRET: ci-build-only-secret-not-used-at-runtime-000000
      DATABASE_URI: postgres://ci:ci@127.0.0.1:5432/ci?schema=payload_schema
      PAYLOAD_SCHEMA: payload_schema
      FRONTEND_URL: http://localhost:3002
      NEXT_PUBLIC_PAYLOAD_URL: http://localhost:3000/api
      NEXT_PUBLIC_FRONTEND_URL: http://localhost:3002
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test:
    name: Unit, integration and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Same major version as production (docker-compose.prod.yml). Each test
    # file creates and drops its own database on this server.
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Storefront and nest-api unit tests, payload-cms integration tests.
      - name: Unit and integration tests
        run: pnpm test

      - name: End-to-end tests (nest-api)
        run: pnpm test:e2e

  smoke:
    name: Docker images (build, smoke and end-to-end tests, vulnerability scan)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Fixes the network name (ws-ci_default) the smoke check joins.
      COMPOSE_PROJECT_NAME: ws-ci
      # Every docker compose command: the production stack plus the mock
      # payment gateway the end-to-end tests pay through.
      COMPOSE_FILE: docker-compose.prod.yml:e2e/docker-compose.e2e.yml
      # Trivy, pinned by digest: its release images and GitHub Action were
      # replaced with malicious ones in March 2026, so a tag alone is not
      # trusted.
      TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A throwaway configuration: the documented example with fresh secrets
      # and database password, as a real deployment needs. (With
      # NODE_ENV=production the services refuse placeholders and default
      # passwords.)
      - name: Create .env
        run: |
          db_password=$(openssl rand -hex 24)
          cp .env.example .env
          sed -i "s|^PAYLOAD_SECRET=.*|PAYLOAD_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^REVALIDATE_SECRET=.*|REVALIDATE_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^REGISTRATION_SECRET=.*|REGISTRATION_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$db_password|" .env
          sed -i "s|^DATABASE_URI=postgres://postgres:postgres@|DATABASE_URI=postgres://postgres:$db_password@|" .env
          sed -i "s|^PAYLOAD_DB_PASSWORD=.*|PAYLOAD_DB_PASSWORD=$(openssl rand -hex 24)|" .env
          sed -i "s|^NEST_DB_PASSWORD=.*|NEST_DB_PASSWORD=$(openssl rand -hex 24)|" .env

      - uses: docker/setup-buildx-action@v4

      # The three images as docker-compose.prod.yml defines them, with layers
      # cached between runs (one cache per image). The migration jobs use the
      # same images.
      - name: Build images
        id: build
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.prod.yml
          targets: payload-cms,nest-api,frontend
          load: true
          set: |
            payload-cms.cache-from=type=gha,scope=payload-cms
            payload-cms.cache-to=type=gha,mode=max,scope=payload-cms,ignore-error=true
            nest-api.cache-from=type=gha,scope=nest-api
            nest-api.cache-to=type=gha,mode=max,scope=nest-api,ignore-error=true
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,mode=max,scope=frontend,ignore-error=true

      - name: Start the stack
        run: docker compose up -d

      # Every service must answer, serve real pages, and work with the
      # others. Run from inside the stack's network: Nest has no host port.
      - name: Smoke check
        run: >-
          docker run --rm --network ws-ci_default
          -v "$PWD/scripts:/scripts:ro"
          -e PAYLOAD_URL=http://payload-cms:3000
          -e NEST_URL=http://nest-api:3001
          -e FRONTEND_URL=http://frontend:3002
          node:24-alpine node /scripts/smoke-check.mjs

      # The demo store, with a demo administrator whose password exists
      # only for this run.
      - name: Seed demo data
        run: |
          admin_password=$(openssl rand -hex 16)
          echo "::add-mask::$admin_password"
          echo "E2E_ADMIN_EMAIL=e2e-admin@example.test" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          docker compose exec -T \
            -e ALLOW_DEMO_SEED=true \
            -e DEMO_ADMIN_EMAIL=e2e-admin@example.test \
            -e DEMO_ADMIN_PASSWORD="$admin_password" \
            payload-cms ./node_modules/.bin/payload run src/seed-demo.ts

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Playwright
        run: |
          pnpm install --frozen-lockfile --filter e2e
          pnpm --filter e2e exec playwright install --with-deps chromium

      # A customer's whole purchase (paid through the mock gateway), the
      # administrator shipping it, and site-wide checks: e2e/README.md.
      - name: End-to-end tests
        run: pnpm test:stack

      - name: Upload end-to-end report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Show service status and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

      # Known vulnerabilities in the images: every HIGH and CRITICAL one is
      # listed, and the job fails on a CRITICAL one that has a fix. Runs even
      # when the smoke test failed, as long as the images were built.
      - name: Scan images (Trivy)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          scan() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache "$TRIVY_IMAGE" \
              image --no-progress --scanners vuln "$@"
          }
          status=0
          for image in watcher-store-frontend watcher-store-nest-api watcher-store-payload-cms; do
            echo "::group::$image"
            scan --severity HIGH,CRITICAL "$image"
            scan --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet \
              "$image" > /dev/null || status=1
            echo "::endgroup::"
          done
          exit $status
