services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  payload-cms:
    build:
      context: .
      dockerfile: backend/payload-cms/Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URI: ${DATABASE_URI}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_SCHEMA: ${PAYLOAD_SCHEMA}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      db:
        condition: service_healthy

  nest-api:
    build:
      context: .
      dockerfile: backend/nest-api/Dockerfile
    ports:
      - '3001:3001'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      NEST_SCHEMA: ${NEST_SCHEMA}
      JWT_SECRET: ${JWT_SECRET}
      PAYLOAD_INTERNAL_URL: http://payload-cms:3000/api
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '3002:3002'
    environment:
      NEXT_PUBLIC_PAYLOAD_URL: http://payload-cms:3000/api
      NEXT_PUBLIC_NESTJS_API_URL: http://nest-api:3001
      NEXT_PUBLIC_FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      - payload-cms
      - nest-api

volumes:
  postgres-data:
