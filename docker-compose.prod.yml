services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # The superuser (POSTGRES_USER) is used only by the database itself and by
  # the two jobs below. Each service connects as its own role, which owns
  # only its own schema (deploy/postgres/).
  #
  # db-roles: creates the roles and schemas (and sets the roles' passwords)
  # on every deploy, before any migration.
  db-roles:
    image: postgres:14-alpine
    environment: &db-admin-environment
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PAYLOAD_SCHEMA: ${PAYLOAD_SCHEMA}
      NEST_SCHEMA: ${NEST_SCHEMA}
      PAYLOAD_DB_PASSWORD: ${PAYLOAD_DB_PASSWORD:?Set PAYLOAD_DB_PASSWORD in .env}
      NEST_DB_PASSWORD: ${NEST_DB_PASSWORD:?Set NEST_DB_PASSWORD in .env}
    volumes:
      - ./deploy/postgres:/sql:ro
    # $$: expanded inside the container, so the passwords never appear on
    # the command line.
    command:
      - sh
      - -c
      - >-
        psql -X -q -v dbname="$$PGDATABASE" -v payload_schema="$$PAYLOAD_SCHEMA"
        -v nest_schema="$$NEST_SCHEMA" -v payload_password="$$PAYLOAD_DB_PASSWORD"
        -v nest_password="$$NEST_DB_PASSWORD" -f /sql/roles.sql
    depends_on:
      db:
        condition: service_healthy

  # db-grants: Nest's access to the Payload tables it uses, once Payload's
  # migrations have created them.
  db-grants:
    image: postgres:14-alpine
    environment: *db-admin-environment
    volumes:
      - ./deploy/postgres:/sql:ro
    command:
      - sh
      - -c
      - psql -X -q -v payload_schema="$$PAYLOAD_SCHEMA" -f /sql/nest-access.sql
    depends_on:
      payload-migrate:
        condition: service_completed_successfully

  payload-migrate:
    image: watcher-store-payload-cms
    env_file:
      - .env
    environment:
      DATABASE_URI: postgres://payload_app:${PAYLOAD_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_SCHEMA: ${PAYLOAD_SCHEMA}
      FRONTEND_URL: ${FRONTEND_URL}
      PAYLOAD_PUBLIC_URL: ${PAYLOAD_PUBLIC_URL}
    command: ['./node_modules/.bin/payload', 'migrate']
    depends_on:
      db-roles:
        condition: service_completed_successfully

  payload-cms:
    image: watcher-store-payload-cms
    build:
      context: .
      dockerfile: backend/payload-cms/Dockerfile
    env_file:
      - .env
    ports:
      - '3000:3000'
    environment:
      DATABASE_URI: postgres://payload_app:${PAYLOAD_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_SCHEMA: ${PAYLOAD_SCHEMA}
      FRONTEND_URL: ${FRONTEND_URL}
      PAYLOAD_PUBLIC_URL: ${PAYLOAD_PUBLIC_URL}
      NEST_INTERNAL_URL: http://nest-api:3001
      # Content edits refresh the storefront's cache at once (only when
      # REVALIDATE_SECRET is set in .env).
      STOREFRONT_INTERNAL_URL: http://frontend:3002
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      # Media storage: local disk (the payload-media volume) unless
      # S3_BUCKET is set (see .env.example).
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      PORT: 3000
    # Uploads stored on local disk survive a rebuild or redeploy.
    volumes:
      - payload-media:/app/media
    depends_on:
      db:
        condition: service_healthy
      payload-migrate:
        condition: service_completed_successfully

  # Applies Nest migrations once per deploy, before the API starts. The API
  # itself does not migrate in production (MIGRATIONS_RUN_ON_BOOT).
  nest-migrate:
    image: watcher-store-nest-api
    env_file:
      - .env
    environment: &nest-environment
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      # Nest's own role, not the superuser (see db-roles).
      POSTGRES_USER: nest_app
      POSTGRES_PASSWORD: ${NEST_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      NEST_SCHEMA: ${NEST_SCHEMA}
      PAYLOAD_SCHEMA: ${PAYLOAD_SCHEMA}
      JWT_SECRET: ${JWT_SECRET}
      # Payments: none until a gateway is configured in .env. The callback
      # URL is where Zarinpal sends the customer's browser back, so it must
      # be this API's public address (required with a gateway).
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-none}
      PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-}
      PAYMENT_TIMEOUT_MS: ${PAYMENT_TIMEOUT_MS:-10000}
      PAYMENT_RECONCILE_AFTER_MINUTES: ${PAYMENT_RECONCILE_AFTER_MINUTES:-15}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_BASE_URL: ${ZARINPAL_BASE_URL:-https://sandbox.zarinpal.com}
      PAYLOAD_INTERNAL_URL: http://payload-cms:3000/api
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: 3001
    command: ['node', 'dist/database/migrate.js']
    depends_on:
      db-roles:
        condition: service_completed_successfully

  nest-api:
    image: watcher-store-nest-api
    build:
      context: .
      dockerfile: backend/nest-api/Dockerfile
    env_file:
      - .env
    ports:
      - '3001:3001'
    environment: *nest-environment
    depends_on:
      db:
        condition: service_healthy
      nest-migrate:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_PAYLOAD_URL: ${NEXT_PUBLIC_PAYLOAD_URL}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL}
    ports:
      - '3002:3002'
    environment:
      PAYLOAD_INTERNAL_URL: http://payload-cms:3000/api
      # The storefront's server calls Nest for the logged-in customer (the
      # /api BFF routes).
      NEST_INTERNAL_URL: http://nest-api:3001
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    depends_on:
      payload-cms:
        condition: service_healthy
      nest-api:
        condition: service_healthy

volumes:
  postgres-data:
  payload-media:
